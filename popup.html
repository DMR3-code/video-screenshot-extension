<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="header">
    <h1>📸 Video Screenshot</h1>
  </div>

  <!-- Show Capture Icons toggle -->
  <div class="setting-group">
    <label class="setting-label" for="iconToggle">Show Capture Icons</label>
    <div class="toggle-container">
      <span>Show overlay icons on videos</span>
      <div
        class="toggle"
        id="iconToggle"
        role="switch"
        aria-checked="false"
        tabindex="0"
        aria-label="Show capture icons on videos"
      >
        <div class="toggle-slider"></div>
      </div>
    </div>
  </div>

  <!-- Image format settings -->
  <div class="setting-group">
    <label class="setting-label">Image Format</label>
    <div class="format-selector">
      <label class="format-option">
        <input type="radio" name="format" id="formatPng" value="png" checked>
        <span class="format-badge">PNG</span>
        <span class="format-desc">Lossless</span>
      </label>
      <label class="format-option">
        <input type="radio" name="format" id="formatJpeg" value="jpeg">
        <span class="format-badge">JPEG</span>
        <span class="format-desc">Smaller file</span>
      </label>
    </div>
    <div class="quality-row" id="qualityRow">
      <label class="quality-label" for="qualitySlider">
        Quality: <span id="qualityValue">92</span>%
      </label>
      <input
        type="range"
        id="qualitySlider"
        min="50"
        max="100"
        value="92"
        class="quality-slider"
        aria-label="JPEG quality"
      >
    </div>
  </div>

  <!-- Keyboard Shortcut -->
  <div class="setting-group">
    <label class="setting-label">Keyboard Shortcut</label>
    <div class="shortcut-display" id="shortcutDisplay">Ctrl+Shift+V</div>
    <a href="chrome://extensions/shortcuts" target="_blank" class="chrome-shortcut-link">
      Customize in Chrome Settings
    </a>
  </div>

  <!-- Action Buttons -->
  <div class="setting-group">
    <button class="capture-button" id="captureButton">
      📸 Download Screenshot
    </button>
    <button class="clipboard-button" id="clipboardButton">
      📋 Copy to Clipboard
    </button>
    <div class="status" id="status" role="status" aria-live="polite">Ready to capture</div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
